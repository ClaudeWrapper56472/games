<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<meta name="description" content="A small collection of browser games. Play in the browser or install to the home screen.">
<meta name="theme-color" content="#f7efe3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎮</text></svg>">
<style>
  :root {
    --bg: #f7efe3;
    --card: #fffaf2;
    --ink: #2f2a24;
    --muted: #7a6f62;
    --line: #e2d5c2;
    --accent: #c2643c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #262220;
      --ink: #f2ebe1;
      --muted: #a89c8d;
      --line: #3a3430;
      --accent: #e08a5d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(2rem, 7vw, 2.75rem); letter-spacing: -0.02em; }
  .tagline { margin: 0.4rem 0 2.5rem; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
  .game {
    display: flex;
    gap: 1rem;
    align-items: center;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .game:hover, .game:focus-visible {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .game img {
    width: 72px;
    height: 72px;
    border-radius: 0.85rem;
    flex: none;
    background: var(--bg);
  }
  .game h2 { margin: 0; font-size: 1.15rem; }
  .game p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .arrow { margin-left: auto; color: var(--accent); font-size: 1.5rem; flex: none; }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <p class="tagline">Play in the browser, or install to the home screen.</p>

  <ul>
    <li>
      <a class="game" href="https://ClaudeWrapper56472.github.io/pwa-sudoku-like/">
        <img src="https://ClaudeWrapper56472.github.io/pwa-sudoku-like/icons/icon-192.png" alt="" width="72" height="72" loading="lazy">
        <span>
          <h2>Nine Lives</h2>
          <p>A cat-themed logic puzzle. One cat per row, column and colour. No touching.</p>
        </span>
        <span class="arrow" aria-hidden="true">&rsaquo;</span>
      </a>
    </li>
  </ul>

  <footer>
    Source on <a href="https://github.com/ClaudeWrapper56472">GitHub</a>.
  </footer>
</main>
</body>
</html>
